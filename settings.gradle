def platformVersionMap = [:]

static def getEnabledPlatforms(file) {
    Properties props = new Properties()
    file.withInputStream { stream ->
        props.load(stream)
    }
    def platforms = props['enabled_platforms']?.split(',')?.collect { it.trim() }
    platforms.add("common")
    return platforms ?: []
}

fileTree(dir: file('versions'), include: '**/gradle.properties').each { propFile ->
    def version = propFile.parentFile.name
    // temp
    if (version != "26.1.2" && version != "26.2")
        return
    def platforms = getEnabledPlatforms(propFile)

    platforms.each { platform ->
        if (platformVersionMap.containsKey(platform)) {
            platformVersionMap[platform] << version
        } else {
            platformVersionMap[platform] = [version]
        }
    }
}

stonecutter {
    create(rootProject) {
        versions "26.1.2", "26.2" // temp
        vcsVersion = "26.2"

        platformVersionMap.each { platform, versions ->
            branch(platform, b -> {
//                b.versions((versions as String[]).findAll { it.startsWith('1') }.toArray() as String[]).buildscript("build.obf.gradle")
                b.versions((versions as String[]).findAll { !it.startsWith('1') }.toArray() as String[]).buildscript("build.unobf.gradle")
            })
        }
    }
}

rootProject.name = 'InvMove'

include 'common'
include 'fabric'
include 'neoforge'
