plugins {
    id "dev.kikugie.stonecutter" version "0.9.3"
//    id 'dev.architectury.loom-remap' version '1.14-SNAPSHOT' apply false
//    id "net.fabricmc.fabric-loom" version "1.17.0-alpha.8" apply false
